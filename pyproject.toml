[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-rag"
version = "0.1.0"
description = "RAG pipeline sederhana pakai OpenRouter dan ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Xiao" }
]
dependencies = [
    "requests>=2.31",
    "chromadb>=0.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_rag"]